<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- font Inter -->
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
    <script src="js.js" defer></script>
    <title>Document</title>
</head>

<body>
    <div id="main-container">
        <div id="display"></div>
        <div id="buttons">
            <div class="row">
                <button class="delete" id="ac">AC</button>
                <button class="delete" id="ce">CE</button>
                <button class="delete" id="backspace">&#x232B;</button>
                <button class="operation" id="divide">/</button>
            </div>
            <div class="row">
                <button class="number" id="seven">7</button>
                <button class="number" id="eight">8</button>
                <button class="number" id="nine">9</button>
                <button class="operation" id="times">x</button>
            </div>
            <div class="row">
                <button class="number" id="four">4</button>
                <button class="number" id="five">5</button>
                <button class="number" id="six">6</button>
                <button class="operation" id="minus">-</button>
            </div>
            <div class="row">
                <button class="number" id="one">1</button>
                <button class="number" id="two">2</button>
                <button class="number" id="three">3</button>
                <button class="operation" id="plus">+</button>
            </div>
            <div class="row">
                <button class="number" id="zero">0</button>
                <button class="number" id="dot">.</button>
                <button id="equals">=</button>
            </div>
        </div>
    </div>
</body>

</html>
